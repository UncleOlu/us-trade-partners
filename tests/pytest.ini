[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    not_run_until_data: test needs data/<snapshot_id> and is skipped (reported as not run) until it exists
    not_run_until_src: test needs src/ and is skipped (reported as not run) until it exists
    not_run_until_raw_member_data: test needs raw member-level EU data that is not part of the source_test sample
