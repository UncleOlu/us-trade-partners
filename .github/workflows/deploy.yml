name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download and verify the pinned snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-snapshot.mjs

      - name: Install Chromium for rendered build checks
        run: npx playwright install --with-deps chromium

      - name: Generate types and fail on drift
        run: |
          npm run gen:types
          if ! git diff --quiet -- src/types/generated.ts; then
            echo "::error::src/types/generated.ts is out of date. Run 'npm run gen:types' and commit the result."
            git diff -- src/types/generated.ts
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /us-trade-partners/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
